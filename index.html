<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Running</title>
  <meta name="description" content="Ton plan d'entraînement running, tout en douceur.">
  <meta name="theme-color" content="#FBF4F1">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Running">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="assets/fonts/nunito-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-900.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Ambiance selon l'heure, posée avant le premier rendu (aucun flash) : matin / jour / soir -->
  <script>
    (function () {
      var q = /[?&]time=(matin|jour|soir)/.exec(location.search), h = new Date().getHours();
      var t = q ? q[1] : h >= 5 && h < 11 ? 'matin' : h >= 19 || h < 5 ? 'soir' : 'jour';
      document.documentElement.setAttribute('data-time', t);
      if (t === 'soir') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#2A1426');
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/screens.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="bg" class="bg-secours" aria-hidden="true"></div>
  <main id="app"></main>
  <nav id="tabbar" class="tabbar lg" aria-label="Navigation principale" hidden></nav>
  <!-- Écran d'ouverture « Monogramme » (2,0 s) : affiché dès le premier rendu, sans attendre le JS -->
  <div id="splash" class="splash play" aria-hidden="true">
    <div class="splash-center">
      <div class="splash-mark"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c3 0 4-3 6-6s4-4 6-4h4M4 21h16"/></svg></div>
      <div class="splash-word">Running</div>
    </div>
    <div class="splash-line"><i></i></div>
  </div>
  <noscript><p style="padding:24px">Running a besoin de JavaScript pour fonctionner.</p></noscript>
</body>
</html>
